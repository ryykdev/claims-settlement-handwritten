spring.application.name=claims

# --- Database / R2DBC Configuration ---
# Connects to PostgreSQL running in Docker Compose (service name 'db')
spring.r2dbc.url=r2dbc:postgresql://db:5432/challenge
spring.r2dbc.username=challenge
spring.r2dbc.password=challenge

# --- Spring Boot Actuator Health Endpoint ---
# Expose the health endpoint and show component details (WebFlux + DB)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Ingestion XMLs
implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-xml")
implementation("com.fasterxml.jackson.module:jackson-module-kotlin")

# run schema.sql - (clean dbs at startup for prototyping)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql